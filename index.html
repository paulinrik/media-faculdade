<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edf1ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Univali">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Média da Univali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Média da Univali</h1>
    <button class="gear" id="openSettings" type="button" aria-label="Configurações"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </header>
  <div class="bar">
    <div id="summary"></div>
    <button class="btn primary" id="addSubj" type="button">+ Matéria</button>
  </div>
  <main id="app"></main>
  <div id="savestate" aria-live="polite"></div>
</div>

<div class="overlay" id="settings" hidden role="dialog" aria-modal="true" aria-labelledby="settings-title">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="settings-title">Configurações</h2>
      <button class="btn" id="closeSettings" type="button">Fechar</button>
    </div>
    <div>
      <label class="field-label" for="target">Soma mínima para passar (M1 + M2 + M3)</label>
      <div class="target-presets">
        <button class="btn" id="use18" type="button">Usar 18,00</button>
        <button class="btn" id="use1775" type="button">Usar 17,75</button>
      </div>
      <input class="f num" id="target" inputmode="decimal" autocomplete="off" aria-label="Média mínima manual">
    </div>
    <button class="btn" id="showTutorial" type="button">Ver tutorial</button>
  </div>
</div>
<div class="overlay" id="targetSetup" hidden role="dialog" aria-modal="true" aria-labelledby="target-setup-title">
  <div class="sheet">
    <div class="sheet-head"><h2 id="target-setup-title">Média mínima para passar</h2></div>
    <p class="tut-text">Na teoria, a soma necessária é 18,00. Você também pode definir outro valor manualmente.</p>
    <div class="target-presets">
      <button class="btn primary" id="setupUse18" type="button">Usar 18,00</button>
      <button class="btn" id="setupUse1775" type="button">Usar 17,75</button>
    </div>
    <label class="field-label" for="setupTarget">Ou informe sua média mínima</label>
    <input class="f num" id="setupTarget" inputmode="decimal" autocomplete="off" aria-label="Média mínima personalizada">
    <button class="btn" id="setupSaveCustom" type="button">Salvar média personalizada</button>
  </div>
</div>
<div class="overlay" id="tutorial" hidden role="dialog" aria-modal="true" aria-labelledby="tut-title">
  <div class="sheet"></div>
</div>

<script src="app.js" defer></script>
</body>
</html>
